<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login AAiai 2.0</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,600,700" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css?family=Nunito:200,600,700');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Nunito', sans-serif;
            color: #334155;
            position: relative;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(128, 0, 255, 0.15);
            box-shadow: 0 0 10px rgba(148, 163, 184, 0.3);
            animation: scan 6s linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABnSURBVGhD7cExAQAwDMCg+zfdm1gQ+JMFK5KkJEk6yZIk6SRrkqSTrEmSTrImSTrJkiTpJEuSpJMsSZJOsiRJOsnqA7k4ASe0vXrVAAAAAElFTkSuQmCC');
            opacity: 0.02;
            pointer-events: none;
            z-index: 1;
        }

        .cyber-polygon-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
        }

        .bg-polygon-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 500px;
            height: 500px;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 20px 30px rgba(100, 116, 139, 0.18));
            animation: float-svg 6s ease-in-out infinite;
        }

        .login-form-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .glass-circle {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(128, 0, 255, 0.18) 0%, rgba(74, 4, 78, 0.28) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(192, 132, 252, 0.4);
            box-shadow: 0 15px 35px rgba(128, 0, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .glass-circle h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: 2px;
            color: #3b0764;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        .glass-circle h4 {
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #581c87;
        }

        .inputs-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .inputs-group input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(192, 132, 252, 0.5);
            border-radius: 5px;
            color: #1e1b4b;
            font-family: 'Nunito', sans-serif;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        .inputs-group input:focus {
            border-color: #8000FF;
            box-shadow: 0 0 10px rgba(128, 0, 255, 0.35);
            background: #ffffff;
        }

        .inputs-group input::placeholder {
            color: #7e22ce;
            opacity: 0.6;
            font-weight: 400;
        }

        .bottom-action-area {
            width: 100%;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .bottom-action-area button {
            width: 100%;
            padding: 9px;
            background: linear-gradient(135deg, #8000FF, #5b21b6);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 5px;
            color: #ffffff;
            font-family: 'Nunito', sans-serif;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(128, 0, 255, 0.3);
        }

        .bottom-action-area button:hover {
            background: linear-gradient(135deg, #9333ea, #8000FF);
            box-shadow: 0 6px 18px rgba(128, 0, 255, 0.45);
            transform: translateY(-1px);
        }

        .msg-container {
            width: 100%;
            text-align: center;
        }

        .msg {
            font-size: 10px;
            line-height: 1.2;
            color: #475569;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .orbit {
            position: absolute;
            border-radius: 35%;
            border: 1px dashed rgba(148, 163, 184, 0.3);
            pointer-events: none;
        }

        .orbit-1 {
            width: 440px;
            height: 440px;
            border-color: rgba(128, 0, 255, 0.2);
            animation: rotate 45s infinite linear;
        }

        .orbit-2 {
            width: 490px;
            height: 490px;
            border-color: rgba(148, 163, 184, 0.25);
            animation: rotate 35s infinite linear reverse;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 5px rgba(128, 0, 255, 0.2);
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float-svg {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.005); }
        }

        @keyframes scan {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        @keyframes particle-float {
            0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="noise"></div>
<div class="scan-line"></div>

<div class="cyber-polygon-container">
    <div class="orbit orbit-1"></div>
    <div class="orbit orbit-2"></div>

    <svg class="bg-polygon-svg" viewBox="0 0 500 500">
        <defs>
            <filter id="cyberShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#334155" flood-opacity="0.15"/>
            </filter>

            <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="50%" stop-color="#e2e8f0"/>
                <stop offset="100%" stop-color="#cbd5e1"/>
            </linearGradient>

            <linearGradient id="violetCore" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a855f7"/>
                <stop offset="50%" stop-color="#8000FF"/>
                <stop offset="100%" stop-color="#3b0764"/>
            </linearGradient>
        </defs>

        <polygon points="200,470 300,470 470,200 400,80 100,80 30,200"
            fill="url(#violetCore)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cyberShadow)"/>

        <polygon points="200,30 300,30 470,300 400,420 100,420 30,300"
            fill="url(#silverPlate)" stroke="#8000FF" stroke-width="2" filter="url(#cyberShadow)"/>
    </svg>

    <div class="login-form-wrapper">
        <form action="#" method="POST" onsubmit="event.preventDefault();">
            <div class="glass-circle">
                <h2>Login</h2>
                <h4>Chut Paglas</h4>
                
                <div class="inputs-group">
                    <input type="text" name="username" placeholder="Username" required autocomplete="username">
                    <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
                </div>
            </div>
            
            <div class="bottom-action-area">
                <button type="submit">Submit</button>
                
                <div class="msg-container">
                    <p class="msg">Login to continue.</p>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.cyber-polygon-container');
    const colors = ['#8000FF', '#a855f7', '#94a3b8', '#cbd5e1', '#38bdf8'];

    for (let i = 0; i < 65; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
              
        const size = Math.random() * 2.5 + 1;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
              
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 230;
        const x = 250 + Math.cos(angle) * radius;
        const y = 250 + Math.sin(angle) * radius;
              
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
              
        const duration = Math.random() * 4 + 2;
        const tx = (Math.random() * 280 - 140);
        const ty = (Math.random() * 280 - 140);
              
        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        particle.style.animation = `particle-float ${duration}s infinite linear`;
        
        container.appendChild(particle);
    }
});
</script>

</body>
</html>
